<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div
        {
            width: 600px;
            height: 400px;
            border: 30px solid;
        }
        h1
        {
            margin-left: 10px;
        }
        p
        {
            margin-left: 10px;
        }
        h2
        {
            margin-left: 10px;
        }
        .b
        {
            margin-left: 10px;
            font-family: comic sans MS ;

        }
    </style>
</head>
<body>
    <div>
        <h1>Example of font tag</h1>
        <p>This is normal text without any font styling. <br><br> <span style="color:blue">Text with normal size and default face</span></p>
        <h2> <span style="color: green;">Text with Increased size and default face </span></h2>
        <p class="b"><span style="color: red;">Text with changed face</span></p>
    </div>
</body>
</html>
